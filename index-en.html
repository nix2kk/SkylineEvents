<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyline Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #c9a84c; --gold-light: #e4c97a;
      --dark: #080808; --dark-alt: #0f0f0f;
      --text: #f0ece4; --text-muted: rgba(240,236,228,0.55);
      --nav-height: 80px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--dark); color: var(--text); font-family: 'Jost', sans-serif; overflow-x: hidden; }

    nav {
      position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height);
      z-index: 200; display: flex; align-items: center; justify-content: space-between;
      padding: 0 3rem;
      background: linear-gradient(to bottom, rgba(0,0,0,0.70) 0%, transparent 100%);
      transition: background 0.4s ease;
    }
    nav.scrolled { background: linear-gradient(to bottom, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.50) 100%); }
    .nav-logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .nav-logo img { height: 60px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); transition: filter 0.35s ease, transform 0.35s ease; }
    .nav-logo:hover img { filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(201,168,76,0.65)); transform: scale(1.07); }
    .nav-right { display: flex; align-items: center; gap: 2.5rem; }
    .nav-links { display: flex; list-style: none; gap: 2.2rem; }
    .nav-links a { font-size: 0.72rem; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text); text-decoration: none; position: relative; text-shadow: 0 1px 6px rgba(0,0,0,0.8); transition: color 0.3s ease, letter-spacing 0.3s ease; }
    .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); width: 0; height: 1px; background: var(--gold); transition: width 0.35s ease; }
    .nav-links a:hover { color: var(--gold); letter-spacing: 0.35em; }
    .nav-links a:hover::after { width: 100%; }
    .nav-socials { display: flex; align-items: center; gap: 1rem; border-left: 1px solid rgba(201,168,76,0.2); padding-left: 1.8rem; }
    .social-icon { color: var(--text); opacity: 0.65; display: flex; align-items: center; transition: opacity 0.3s ease, color 0.3s ease; }
    .social-icon:hover { opacity: 1; color: var(--gold); }
    .lang-switcher { position: relative; }
    .lang-btn { background: none; border: 1px solid rgba(201,168,76,0.4); color: var(--gold); font-family: 'Jost', sans-serif; font-size: 0.65rem; font-weight: 500; letter-spacing: 0.2em; padding: 0.35rem 0.75rem; cursor: pointer; transition: all 0.3s ease; }
    .lang-btn:hover { border-color: var(--gold); background: rgba(201,168,76,0.08); }
    .lang-dropdown { position: absolute; top: calc(100% + 10px); right: 0; background: rgba(8,8,8,0.97); border: 1px solid rgba(201,168,76,0.2); min-width: 70px; opacity: 0; pointer-events: none; transform: translateY(-6px); transition: opacity 0.25s ease, transform 0.25s ease; z-index: 500; }
    .lang-dropdown.open { opacity: 1; pointer-events: all; transform: translateY(0); }
    .lang-option { display: block; padding: 0.6rem 1rem; font-size: 0.65rem; font-weight: 400; letter-spacing: 0.2em; color: var(--text-muted); text-decoration: none; text-transform: uppercase; transition: color 0.2s ease, background 0.2s ease; }
    .lang-option:hover, .lang-option.active { color: var(--gold); background: rgba(201,168,76,0.05); }
    .hamburger { display: none; flex-direction: column; justify-content: center; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; z-index: 300; }
    .hamburger span { display: block; width: 22px; height: 1.5px; background: var(--gold); transition: all 0.35s ease; transform-origin: center; }
    .hamburger.active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .hamburger.active span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.active span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }
    .mobile-menu { position: fixed; inset: 0; background: rgba(8,8,8,0.98); z-index: 150; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
    .mobile-menu.open { opacity: 1; pointer-events: all; }
    .mobile-menu a { font-family: 'Cormorant Garant', serif; font-size: 2.2rem; font-weight: 300; letter-spacing: 0.15em; color: var(--text); text-decoration: none; text-transform: uppercase; transition: color 0.3s ease; }
    .mobile-menu a:hover { color: var(--gold); }
    .mobile-menu-socials { display: flex; gap: 1.8rem; margin-top: 1rem; padding-top: 1.5rem; border-top: 1px solid rgba(201,168,76,0.2); }
    .mobile-menu-socials a { color: var(--text-muted); transition: color 0.3s ease; }
    .mobile-menu-socials a:hover { color: var(--gold); }
    .mobile-lang { display: flex; align-items: center; gap: 1.2rem; margin-top: -0.5rem; }
    .mobile-lang-btn { font-family: 'Jost', sans-serif !important; font-size: 0.75rem !important; font-weight: 400; letter-spacing: 0.35em; color: var(--text-muted) !important; text-decoration: none; text-transform: uppercase; transition: color 0.3s ease !important; }
    .mobile-lang-btn.active, .mobile-lang-btn:hover { color: var(--gold) !important; }
    html, body { height: 100%; overflow: hidden; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(201,168,76,0.04) 0%, transparent 65%); pointer-events: none; }
    .hero { position: relative; width: 100%; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .hero video { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); min-width: 100%; min-height: 100%; width: auto; height: auto; object-fit: cover; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(8,8,8,0.20) 0%, rgba(8,8,8,0.45) 50%, rgba(8,8,8,0.80) 100%); }
    .hero-content { position: relative; z-index: 10; text-align: center; padding: 0 2rem; opacity: 0; transform: translateY(28px); animation: fadeUp 1.2s ease forwards; animation-delay: 0.4s; }
    .hero-label { font-size: 0.68rem; font-weight: 400; letter-spacing: 0.45em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.4rem; }
    .hero-title { font-family: 'Cormorant Garant', serif; font-size: clamp(1.8rem, 3.5vw, 3rem); font-weight: 300; line-height: 1.1; color: var(--text); margin-bottom: 2.5rem; }
    .hero-title em { font-style: italic; color: var(--gold-light); }
    .hero-btn { display: inline-block; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--dark); background: var(--gold); text-decoration: none; padding: 1rem 2.8rem; transition: background 0.3s ease, letter-spacing 0.3s ease; }
    .hero-btn:hover { background: var(--gold-light); letter-spacing: 0.45em; }
    @media (max-width: 900px) { .nav-links { display: none; } .nav-socials { display: none; } .hamburger { display: flex; } nav { padding: 0 1.5rem; } }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  <script>
    const langMap = {
      'index.html':'index-en.html','quem-somos.html':'quem-somos-en.html',
      'servicos.html':'servicos-en.html','performance.html':'performance-en.html',
      'contactos.html':'contactos-en.html','index-en.html':'index.html',
      'quem-somos-en.html':'quem-somos.html','servicos-en.html':'servicos.html',
      'performance-en.html':'performance.html','contactos-en.html':'contactos.html',
    };
    const pageLang = document.documentElement.getAttribute('data-lang');
    const storedLang = localStorage.getItem('skyline-lang') || 'pt';
    if (storedLang !== pageLang) {
      const currentFile = window.location.pathname.split('/').pop() || 'index.html';
      const targetFile = langMap[currentFile];
      if (targetFile) window.location.replace(targetFile);
    }
    const navbar = document.getElementById('navbar');
    if (navbar) window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 50));
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    if (hamburger) {
      hamburger.addEventListener('click', () => {
        hamburger.classList.toggle('active');
        mobileMenu.classList.toggle('open');
        document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
      });
      document.querySelectorAll('.mobile-menu a').forEach(l => l.addEventListener('click', () => {
        hamburger.classList.remove('active'); mobileMenu.classList.remove('open'); document.body.style.overflow = '';
      }));
    }
    const langBtn = document.getElementById('langBtn');
    const langDropdown = document.getElementById('langDropdown');
    if (langBtn) {
      langBtn.addEventListener('click', (e) => { e.stopPropagation(); langDropdown.classList.toggle('open'); });
      document.addEventListener('click', () => langDropdown.classList.remove('open'));
      document.querySelectorAll('.lang-option').forEach(opt => {
        opt.addEventListener('click', (e) => {
          e.preventDefault();
          localStorage.setItem('skyline-lang', opt.getAttribute('data-lang'));
          const f = window.location.pathname.split('/').pop() || 'index.html';
          if (langMap[f]) window.location.href = langMap[f];
        });
      });
    }
    document.querySelectorAll('.mobile-lang-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.setItem('skyline-lang', btn.getAttribute('data-lang'));
        const f = window.location.pathname.split('/').pop() || 'index.html';
        if (langMap[f]) window.location.href = langMap[f];
      });
    });  

      const video = document.querySelector('.hero video');
    if (video) {
    video.play().catch(() => {});
    }
  </script>
